services:
  db:
    image: mysql:8.0
    container_name: rack_climate_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: PASSWORD
      MYSQL_DATABASE: climate_monitor
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: rack_climate_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=PASSWORD
      - DB_NAME=climate_monitor
      - PYTHONUNBUFFERED=1
    devices:
      - "/dev/ttyACM2:/dev/ttyACM2"
    privileged: true 

volumes:
  mysql_data:
